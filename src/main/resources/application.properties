spring.application.name=onna
spring.profiles.default=local

# 접속 정보는 커밋하지 않는 .env에 두고, 로컬에서는 이 파일을 설정값으로 읽는다. 운영은 컨테이너 환경변수로 받는다.
spring.config.import=optional:file:.env[.properties]

# 컨트롤러까지 지연 로딩이 새면 응답 직렬화 중에 쿼리가 나가므로 막는다.
spring.jpa.open-in-view=false

# 태그 사전·구역 좌표(data.sql)는 Hibernate가 테이블을 만든 뒤에 넣어야 하므로 실행을 늦춘다.
# 로컬·운영 모두 MySQL이라 기본값(내장 DB에서만 실행)으로는 돌지 않아 always로 켠다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# 거리 단계 경계(m): 150m 넘으면 S0, 60~150 S1, 25~60 S2, 25 이하 OPEN. 현장 테스트 후 조정한다.
app.blur.s1-m=150
app.blur.s2-m=60
app.blur.open-m=25
# 위치 오차가 이보다 크면 열기를 막는다.
app.blur.max-accuracy-m=50

# 사진 업로드 최대 10MB. 넘으면 400 INVALID_INPUT. 요청 전체는 폼 값 여유를 둔다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# JWT. 비밀키는 .env의 JWT_SECRET(32바이트 이상)으로 받는다.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=1h
app.jwt.refresh-expiration=14d
# CORS 허용 출처(쉼표로 구분). 앱은 CORS 영향이 없고 웹 테스트용이다. 배포 도메인이 생기면 추가한다.
app.cors.allowed-origins=http://localhost:5173
