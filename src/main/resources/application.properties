spring.application.name=closer
spring.profiles.default=local

# 접속 정보는 커밋하지 않는 .env에 두고, 로컬에서는 이 파일을 설정값으로 읽는다. 운영은 컨테이너 환경변수로 받는다.
spring.config.import=optional:file:.env[.properties]

# 컨트롤러까지 지연 로딩이 새면 응답 직렬화 중에 쿼리가 나가므로 막는다.
spring.jpa.open-in-view=false

# 거리 단계 경계(m): 150m 넘으면 S0, 60~150 S1, 25~60 S2, 25 이하 OPEN. 현장 테스트 후 조정한다.
app.blur.s1-m=150
app.blur.s2-m=60
app.blur.open-m=25
# 위치 오차가 이보다 크면 열기를 막는다.
app.blur.max-accuracy-m=50
