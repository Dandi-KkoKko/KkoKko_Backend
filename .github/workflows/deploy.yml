# main에 병합되면 테스트 → 이미지 빌드·GHCR push → SSM으로 EC2에서 새 이미지를 받아 재시작한다.
# SSH(22번)를 쓰지 않는다. 이유와 설정 절차는 docs/adr/0003, docs/DEPLOY.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 연달아 병합돼도 배포가 겹치지 않게 하나씩 실행한다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dandi-kkokko/kkokko_backend
  AWS_REGION: ap-southeast-2

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest는 서버가 받아 갈 태그, 커밋 SHA 태그는 되돌릴 때 쓴다.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMPOSE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/compose.prod.yaml
        run: |
          # compose 파일도 이 커밋 기준으로 받아서 이미지와 설정이 어긋나지 않게 한다.
          commands=$(jq -nc --arg url "$COMPOSE_URL" '[
            "set -e",
            "cd /opt/onna",
            "curl -fsSL \($url) -o compose.prod.yaml",
            "docker compose -f compose.prod.yaml pull app",
            "docker compose -f compose.prod.yaml up -d",
            "docker image prune -f"
          ]')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":$commands}" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          # 명령을 보낸 직후에는 실행 기록이 아직 없어 조회가 실패할 수 있다.
          sleep 5
          # 실패해도 서버 출력을 남기고 워크플로를 실패로 끝낸다.
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
          status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$status" = "Success"
